<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetris</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta name="theme-color" content="#a000f0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <div class="board-wrap">
      <canvas id="board" width="300" height="600"></canvas>
      <div id="overlay" class="overlay">
        <div id="overlayText">PAUSADO</div>
        <div id="overlayDetail" class="overlay-detail"></div>
        <button id="restartBtn" type="button">Jogar de novo</button>
      </div>
    </div>
    <div class="panel">
      <div class="box">
        <h2>Pontuação</h2>
        <div class="value" id="score">0</div>
      </div>
      <div class="box">
        <h2>Linhas</h2>
        <div class="value" id="lines">0</div>
      </div>
      <div class="box">
        <h2>Nível</h2>
        <div class="value" id="level">1</div>
      </div>
      <div class="box">
        <h2>Recorde</h2>
        <div class="value" id="best">0</div>
      </div>
      <div class="box">
        <h2>Guardada</h2>
        <canvas id="hold" width="120" height="120"></canvas>
      </div>
      <div class="box">
        <h2>Próxima</h2>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <div class="box">
        <h2>Música</h2>
        <button id="musicBtn" type="button" class="music-btn">▶ Tocar</button>
      </div>
      <div class="box controls">
        <h2>Controles</h2>
        <div><span>← →</span> Mover</div>
        <div><span>↓</span> Descer</div>
        <div><span>↑ / X</span> Girar</div>
        <div><span>Espaço</span> Soltar</div>
        <div><span>C</span> Guardar</div>
        <div><span>P / Esc</span> Pausar</div>
        <div><span>M</span> Música</div>
      </div>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
